<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#101827">
  <title>Hangman — Word Guessing Game</title>
  <style>
    :root{color-scheme:dark;--bg:#101827;--panel:#182438;--panel2:#202f46;--ink:#f4f7fc;--muted:#a5b2c5;--line:#34435a;--accent:#9be6c1;--warn:#ffb7a8}
    *{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 50% -15%,#2a3c56 0,transparent 57%),var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif;display:grid;place-items:center;padding:24px}
    main{width:min(100%,780px)}header{text-align:center;margin-bottom:26px}header p,.hint{color:var(--muted)}.eyebrow{text-transform:uppercase;letter-spacing:.2em;font-size:.75rem;font-weight:800;color:var(--accent);margin:0 0 8px}h1{font-size:clamp(2.25rem,7vw,4rem);line-height:1.05;letter-spacing:-.055em;margin:0}header p{margin:12px 0 0}
    .game{background:linear-gradient(150deg,#1a2940,#162236);border:1px solid #33445c;border-radius:24px;padding:clamp(18px,5vw,36px);box-shadow:0 24px 80px #0005}.status{display:flex;justify-content:space-between;gap:14px;flex-wrap:wrap;color:var(--muted);font-size:.9rem}.status strong{color:var(--ink)}
    .stage{height:206px;display:grid;place-items:center;margin:10px 0 14px}.stage svg{height:100%;max-width:100%;overflow:visible}.gallows{stroke:#91a3bd;stroke-width:6;stroke-linecap:round;fill:none}.person{stroke:var(--warn);stroke-width:5;stroke-linecap:round;fill:none;opacity:0;transition:opacity .2s}.person.show{opacity:1}
    .message{text-align:center;min-height:28px;font-weight:700;color:var(--accent);margin:0 0 18px}.message.lost{color:var(--warn)}.word{display:flex;justify-content:center;gap:clamp(6px,2vw,13px);flex-wrap:wrap;margin:8px 0 17px}.letter{width:clamp(23px,6vw,44px);height:52px;display:grid;place-items:center;border-bottom:3px solid #8091a9;font-size:clamp(1.15rem,5vw,2rem);font-weight:800;text-transform:uppercase}.letter.revealed{color:var(--accent);border-color:var(--accent)}
    .keyboard{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:8px;margin:0 auto;max-width:540px}.key,.new-game{border:1px solid #44556f;background:var(--panel2);color:var(--ink);border-radius:10px;min-height:43px;font:inherit;font-weight:700;font-size:1rem;cursor:pointer;transition:transform .12s,background .12s,border-color .12s}.key:hover:not(:disabled),.new-game:hover{transform:translateY(-2px);border-color:var(--accent);background:#2a4057}.key:disabled{opacity:.38;cursor:not-allowed}.key.correct{background:#245a48;border-color:#41886d}.key.wrong{background:#563b43;border-color:#86545c}.key:focus-visible,.new-game:focus-visible{outline:3px solid var(--accent);outline-offset:2px}.footer{display:flex;justify-content:center;align-items:center;gap:16px;flex-wrap:wrap;margin-top:22px}.new-game{padding:11px 22px;background:var(--accent);border-color:var(--accent);color:#13231c}.new-game:hover{background:#b8f0d3;color:#13231c}.hint{text-align:center;font-size:.85rem;margin:15px 0 0}
    @media(max-width:470px){body{padding:15px}.game{border-radius:18px}.keyboard{gap:6px}.key{min-height:40px}.stage{height:180px}}
  </style>
</head>
<body>
  <main>
    <header><p class="eyebrow">A little word game</p><h1>Hangman</h1><p>Guess the hidden word before the drawing is complete.</p></header>
    <section class="game" aria-label="Hangman game">
      <div class="status"><span>Category: <strong id="category">—</strong></span><span>Wrong guesses: <strong id="mistakes">0</strong> / 6</span></div>
      <div class="stage" aria-hidden="true">
        <svg viewBox="0 0 220 190" role="img">
          <path class="gallows" d="M28 176h138M62 176V22h90v24M62 52l29-30"/>
          <circle class="person" data-part="0" cx="152" cy="62" r="17"/>
          <path class="person" data-part="1" d="M152 79v43"/>
          <path class="person" data-part="2" d="m152 89-25 21"/>
          <path class="person" data-part="3" d="m152 89 25 21"/>
          <path class="person" data-part="4" d="m152 122-22 30"/>
          <path class="person" data-part="5" d="m152 122 22 30"/>
        </svg>
      </div>
      <p class="message" id="message" aria-live="polite">Pick a letter to get started.</p>
      <div class="word" id="word" aria-label="Hidden word"></div>
      <div class="keyboard" id="keyboard" aria-label="Letter keys"></div>
      <div class="footer"><button class="new-game" id="newGame" type="button">New game</button></div>
      <p class="hint">You can also use your keyboard. Press Enter to start a new game.</p>
    </section>
  </main>
  <script>
    'use strict';
    const words = [
      {category:'Nature',word:'rainbow'},{category:'Nature',word:'mountain'},{category:'Nature',word:'sunflower'},
      {category:'Food',word:'pancake'},{category:'Food',word:'avocado'},{category:'Food',word:'blueberry'},
      {category:'Animals',word:'penguin'},{category:'Animals',word:'dolphin'},{category:'Animals',word:'hedgehog'},
      {category:'Places',word:'library'},{category:'Places',word:'island'},{category:'Places',word:'waterfall'},
      {category:'Everyday things',word:'backpack'},{category:'Everyday things',word:'candle'},{category:'Everyday things',word:'umbrella'}
    ];
    const alphabet='abcdefghijklmnopqrstuvwxyz';
    let answer, category, guessed, mistakes, finished;
    const $=id=>document.getElementById(id);
    function startGame(){
      let pick=words[Math.floor(Math.random()*words.length)];
      if(words.length>1&&pick.word===answer)pick=words[(words.indexOf(pick)+1)%words.length];
      answer=pick.word;category=pick.category;guessed=new Set();mistakes=0;finished=false;
      $('category').textContent=category;$('mistakes').textContent='0';$('message').textContent='Pick a letter to get started.';$('message').className='message';
      document.querySelectorAll('.person').forEach(part=>part.classList.remove('show'));
      renderWord();renderKeyboard();
    }
    function renderWord(){
      $('word').innerHTML=[...answer].map(letter=>`<span class="letter${guessed.has(letter)||finished?' revealed':''}">${guessed.has(letter)||finished?letter:'&nbsp;'}</span>`).join('');
      $('word').setAttribute('aria-label',finished?`Word: ${answer}`:'Hidden word');
    }
    function renderKeyboard(){
      $('keyboard').innerHTML=[...alphabet].map(letter=>{
        const wrong=guessed.has(letter)&&!answer.includes(letter),right=guessed.has(letter)&&answer.includes(letter);
        return `<button type="button" class="key${right?' correct':''}${wrong?' wrong':''}" data-letter="${letter}" ${guessed.has(letter)||finished?'disabled':''} aria-label="${letter.toUpperCase()}" aria-pressed="${guessed.has(letter)}">${letter.toUpperCase()}</button>`;
      }).join('');
    }
    function guess(letter){
      if(finished||guessed.has(letter)||!alphabet.includes(letter))return;
      guessed.add(letter);
      if(!answer.includes(letter)){mistakes++;$('mistakes').textContent=mistakes;document.querySelector(`.person[data-part="${mistakes-1}"]`)?.classList.add('show');}
      const won=[...answer].every(char=>guessed.has(char));
      if(won){finished=true;$('message').textContent='You got it! Nice guessing.';}
      else if(mistakes>=6){finished=true;$('message').textContent=`Game over — the word was ${answer}.`;$('message').classList.add('lost');}
      else $('message').textContent=answer.includes(letter)?'Good guess!':'Not quite — try another letter.';
      renderWord();renderKeyboard();
    }
    $('keyboard').addEventListener('click',event=>{const button=event.target.closest('[data-letter]');if(button)guess(button.dataset.letter);});
    $('newGame').addEventListener('click',startGame);
    document.addEventListener('keydown',event=>{if(event.key==='Enter'){startGame();return;}if(event.key.length===1)guess(event.key.toLowerCase());});
    startGame();
  </script>
</body>
</html>
